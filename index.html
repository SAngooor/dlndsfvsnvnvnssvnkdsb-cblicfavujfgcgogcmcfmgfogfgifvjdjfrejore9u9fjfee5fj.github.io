<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Виртуальная лаборатория - Реакция Толленса</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-image: url("backgroundIKT.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ (КНОПКИ ИНСТРУКЦИИ) --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            z-index: 100;
            /* Полупрозрачный фон для лучшей читаемости кнопок */
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }

        .top-btn {
            background: rgba(30, 30, 30, 0.9);
            color: #fff;
            border: 1px solid #0f0;
            padding: 10px 20px;
            margin-right: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .top-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            transform: translateY(-2px);
        }

        /* --- ЛАБОРАТОРНЫЙ СТОЛ --- */
        .table-surface {
            position: fixed;
            bottom: 120px;
            left: 10%;
            width: 80%;
            height: 25px;
            background: linear-gradient(to bottom, #d2b48c, #8b7355);
            border-radius: 5px 5px 0 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .table-front {
            position: fixed;
            bottom: 10px;
            left: 10%;
            width: 80%;
            height: 110px;
            background: linear-gradient(to bottom, rgba(90, 70, 50, 0.8), rgba(50, 40, 30, 0.9));
            border-bottom: 5px solid #3e3226;
            z-index: 9;
        }

        /* --- СЦЕНА --- */
        .lab-scene {
            position: fixed;
            bottom: 145px;
            left: 0;
            width: 100%;
            height: 400px;
            z-index: 15;
        }

        /* --- ДЕКОРАТИВНЫЕ КОЛБЫ --- */
        .table-flasks {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 10%;
            box-sizing: border-box;
        }
        .deco-flask {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            transition: 0.3s;
        }
        .deco-flask.used { opacity: 0.4; }
        .flask-body {
            width: 40px; height: 50px;
            background: rgba(200, 220, 255, 0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 0 0 15px 15px;
            position: relative;
        }
        .flask-body::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 40%;
            background: rgba(100, 150, 255, 0.2);
            border-radius: 0 0 13px 13px;
        }
        .flask-neck {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            border-bottom: none;
            background: rgba(200, 220, 255, 0.1);
            border-radius: 3px 3px 0 0;
        }
        .flask-label {
            color: #ccc; font-size: 12px; margin-top: 5px;
            text-shadow: 1px 1px 2px black;
        }

        /* --- ШТАТИВ И ПРОБИРКА --- */
        .lab-stand {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .test-tube-container { position: relative; }
        
        .test-tube {
            width: 80px; height: 220px;
            border: 4px solid rgba(200, 200, 200, 0.7);
            border-top: none;
            border-radius: 0 0 40px 40px;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.2), 0 5px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            transition: 1.5s; 
        }
        .liquid {
            position: absolute;
            bottom: 0; width: 100%; height: 0%;
            background: rgba(173, 216, 230, 0.4); 
            transition: height 1s, background-color 1s, opacity 1s;
            border-radius: 0 0 36px 36px;
        }
        .liquid.fill { height: 60%; }
        .precipitate { background: rgba(139, 69, 19, 0.85) !important; }
        .silver-mirror {
            background: linear-gradient(135deg, #c0c0c0, #f8f8f8, #a9a9a9, #e8e8e8) !important;
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.9), 0 5px 20px rgba(192, 192, 192, 0.6);
        }
        .silver-mirror .liquid { background: rgba(220, 220, 220, 0.2) !important; }

        .stand-stick {
            width: 10px; height: 280px;
            background: linear-gradient(to right, #666, #888, #666);
            position: absolute; top: -50px; left: -35px;
            border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .stand-base {
            width: 150px; height: 10px;
            background: linear-gradient(to bottom, #888, #555);
            position: absolute; bottom: -10px; left: -55px;
            border-radius: 5px; box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }
        .stand-clamp {
            width: 20px; height: 10px;
            background: #777;
            position: absolute; top: -2px; left: -10px;
            border-radius: 2px;
        }

        /* --- АНИМАЦИЯ КОЛБЫ (БЕЗ СТРУИ ВНУТРИ) --- */
        .virtual-pour {
            position: absolute;
            top: -80px; 
            left: 75%;
            transform: translateX(-50%) translateY(-20px) rotate(0deg);
            transform-origin: bottom right;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .virtual-pour.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0px) rotate(-70deg);
        }
        .v-flask-neck {
            width: 20px; height: 15px;
            border: 2px solid rgba(255,255,255,0.6);
            border-bottom: none;
            background: rgba(150, 200, 255, 0.1);
            border-radius: 3px 3px 0 0;
        }
        .v-flask-body {
            width: 40px; height: 40px;
            background: rgba(150, 200, 255, 0.2);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 0 0 10px 10px;
        }

        /* --- СТРУЯ ЖИДКОСТИ (ОТДЕЛЬНО ОТ КОЛБЫ) --- */
        .pour-stream {
            position: absolute;
            top: -18px;    /* Начинается чуть выше пробирки */
            left: 25%;     /* Ровно по центру пробирки */
            transform: translateX(-50%); /* Идеальное центрирование */
            width: 6px;
            height: 0;
            background: linear-gradient(to bottom, rgba(100, 180, 255, 0.9), rgba(100, 180, 255, 0.2));
            border-radius: 0 0 3px 3px;
            opacity: 0;
            transition: height 0.3s ease 0.5s, opacity 0.2s ease 0.5s; /* Появляется с задержкой после наклона колбы */
            box-shadow: 0 0 8px rgba(100, 180, 255, 0.6);
            z-index: 15;
            pointer-events: none;
        }
        /* Активируем струю */
        .pour-stream.active {
            height: 110px; /* Длина струи ровно до дна пробирки */
            opacity: 1;
        }


        /* --- ВОДЯНАЯ БАНЯ И НАГРЕВАНИЕ --- */
        .water-bath-container {
            position: absolute;
            bottom: -30px; 
            left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 50px;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }
        .water-bath-container.active { opacity: 1; z-index: 1; }
        
        .bath-glass {
            width: 100%; height: 100%;
            border: 3px solid rgba(200, 200, 200, 0.5);
            border-radius: 0 0 10px 10px;
            background: rgba(100, 149, 237, 0.2);
            position: relative;
            overflow: hidden;
        }
        .bath-water {
            position: absolute; bottom: 0; width: 100%; height: 80%;
            background: rgba(100, 149, 237, 0.4);
            border-radius: 0 0 7px 7px;
        }
        .water-bath-container.active .bath-water {
            animation: boil 0.5s infinite alternate;
        }
        @keyframes boil {
            from { background-color: rgba(100, 149, 237, 0.4); }
            to { background-color: rgba(150, 180, 255, 0.6); }
        }

        .burner {
            position: absolute;
            bottom: -25px; left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 20px;
            background: #555;
            border-radius: 3px;
        }
        .flame {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 30px; height: 40px;
            background: radial-gradient(circle, #ff4500 0%, #ff8c00 40%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .water-bath-container.active .flame {
            opacity: 1;
            animation: flicker 0.15s infinite alternate;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        /* --- ПАНЕЛЬ УПРАВЛЕНИЯ --- */
        .black-area {
            position: fixed; left: 0; bottom: 0; width: 100%; height: 120px;
            background: linear-gradient(to bottom, #1a1a1a, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; border-top: 2px solid #444;
        }
        .controls { margin-bottom: 10px; }
        button.action-btn {
            padding: 10px 20px; margin: 0 5px; font-size: 16px; font-weight: bold;
            border: 2px solid #444; border-radius: 8px; cursor: pointer;
            background: #222; color: #eee; transition: 0.3s;
            text-shadow: 1px 1px 2px black;
        }
        button.action-btn:hover:not(:disabled) {
            background: #444; border-color: #0f0; color: #0f0;
            transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0, 255, 0, 0.2);
        }
        button.action-btn:disabled {
            background: #111; color: #555; border-color: #222; cursor: not-allowed;
        }
        #log {
            color: #0f0; font-size: 16px; text-align: center;
            text-shadow: 0 0 8px #0f0; height: 24px; max-width: 90%;
        }
        .error { color: #ff4c4c !important; text-shadow: 0 0 8px #ff4c4c !important; }
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
    <script>
        let step = 0;
        let isAnimating = false;

        const flaskMap = {
            'AgNO3': 'flask-1',
            'NaOH': 'flask-2',
            'NH3': 'flask-3',
            'aldehyde': 'flask-4'
        };

        function action(type) {
            if (isAnimating) return;
            
            const logElement = document.getElementById("log");
            const testTube = document.querySelector(".test-tube");
            const liquid = document.querySelector(".liquid");
            const pourAnim = document.querySelector(".virtual-pour");
            const streamAnim = document.querySelector(".pour-stream");
            const heatAnim = document.querySelector(".water-bath-container");

            logElement.classList.remove("error", "shake");

            if ((type === "AgNO3" && step === 0) ||
                (type === "NaOH" && step === 1) ||
                (type === "NH3" && step === 2) ||
                (type === "aldehyde" && step === 3) ||
                (type === "heat" && step === 4)) {
                
                isAnimating = true;
                disableButtons(true);

                if (type === "heat") {
                    heatAnim.classList.add("active");
                    setTimeout(() => {
                        applyChemistry(type, testTube, liquid, logElement);
                        heatAnim.classList.remove("active");
                        isAnimating = false;
                        if(step < 5) disableButtons(false);
                    }, 2000);
                } else {
                    document.getElementById(flaskMap[type]).classList.add("used");
                    
                    // 1. Показываем наклоняющуюся колбу
                    pourAnim.classList.add("active");
                    // 2. Показываем струю (чуть позже, чтобы колба успела наклониться)
                    streamAnim.classList.add("active");
                    
                    setTimeout(() => {
                        applyChemistry(type, testTube, liquid, logElement);
                        // Убираем все обратно
                        pourAnim.classList.remove("active");
                        streamAnim.classList.remove("active");
                        isAnimating = false;
                        if(step < 5) disableButtons(false);
                    }, 1200);
                }
            } else {
                log("Неверная последовательность! Следуйте инструкции.");
                logElement.classList.add("error", "shake");
            }
        }

        function applyChemistry(type, testTube, liquid, logElement) {
            if (type === "AgNO3") {
                step = 1;
                log("1. В чистую пробирку прилили раствор AgNO₃.");
                liquid.classList.add("fill");
            } else if (type === "NaOH") {
                step = 2;
                log("2. Добавили NaOH. Наблюдаем бурый осадок Ag₂O.");
                liquid.classList.add("precipitate");
            } else if (type === "NH3") {
                step = 3;
                log("3. Добавили NH₃. Осадок растворился — реактив Толленса готов.");
                liquid.classList.remove("precipitate");
            } else if (type === "aldehyde") {
                step = 4;
                log("4. Добавлено исследуемое вещество (альдегид).");
            } else if (type === "heat") {
                step = 5;
                log("5-6. Нагрев на водяной бане. Образовалось «серебряное зеркало»!");
                testTube.classList.add("silver-mirror");
                disableButtons(true);
            }
        }

        function log(text) {
            document.getElementById("log").innerText = text;
        }

        function disableButtons(state) {
            document.querySelectorAll('button.action-btn').forEach(btn => btn.disabled = state);
        }
    </script>
</head>
<body>

    <!-- НОВЫЕ КНОПКИ В ВЕРХНЕМ ЛЕВОМ УГЛУ -->
    <div class="top-bar">
        <!-- ЗДЕСЬ ВПИШИТЕ СВОИ ПУТИ/ССЫЛКИ В АТРИБУТЫ href -->
        <div style="position: relative; display: inline-block;">
            <button class="top-btn" onclick="this.nextElementSibling.classList.toggle('show')">📋 Инструкция ▾</button>
            <div class="dropdown-content" style="display: none; position: absolute; top: 100%; left: 0; background-color: #1a1a1a; min-width: 200px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 1000; border: 1px solid #0f0; border-radius: 0 0 5px 5px; overflow: hidden;">
                <a href="#" class="dropdown-item" style="color: #eee; padding: 12px 16px; text-decoration: none; display: block; border-bottom: 1px solid #333;">Прилейте в чистую сухую пробирку раствор нитрата серебра (AgNO₃).</a>
                <a href="#" class="dropdown-item" style="color: #eee; padding: 12px 16px; text-decoration: none; display: block; border-bottom: 1px solid #333;">Добавьте раствор гидроксида натрия (NaOH).</a>
                <a href="#" class="dropdown-item" style="color: #eee; padding: 12px 16px; text-decoration: none; display: block; border-bottom: 1px solid #333;">Добавьте раствор аммиака (NH₃·H₂O) </a>
                <a href="#" class="dropdown-item" style="color: #eee; padding: 12px 16px; text-decoration: none; display: block; border-bottom: 1px solid #333;">К полученному раствору добавьте исследуемое вещество</a>
                <a href="#" class="dropdown-item" style="color: #eee; padding: 12px 16px; text-decoration: none; display: block;">Нагрейте</a>
            </div>
        </div>
        <a href="Tasks.docx" class="top-btn">📄 Документ Word</a>
        <a href="https://youtu.be/mYR5hSoufbQ?si=2O1XV9imb2bNeW_M" target="_blank" class="top-btn">▶ YouTube</a>
    </div>

    <div class="table-front"></div>
    <div class="table-surface"></div>

    <div class="lab-scene">
        <div class="table-flasks">
            <div class="deco-flask" id="flask-1">
                <div class="flask-neck"></div>
                <div class="flask-body"></div>
                <div class="flask-label">AgNO₃</div>
            </div>
            <div class="deco-flask" id="flask-2">
                <div class="flask-neck"></div>
                <div class="flask-body"></div>
                <div class="flask-label">NaOH</div>
            </div>
            <div class="deco-flask" id="flask-3">
                <div class="flask-neck"></div>
                <div class="flask-body"></div>
                <div class="flask-label">NH₃·H₂O</div>
            </div>
            <div class="deco-flask" id="flask-4">
                <div class="flask-neck"></div>
                <div class="flask-body"></div>
                <div class="flask-label">Альдегид</div>
            </div>
        </div>

        <div class="lab-stand">
            <div class="stand-stick"></div>
            <div class="stand-base"></div>
            
            <div class="test-tube-container">
                <div class="stand-clamp"></div>
                
                <!-- Колба теперь отдельно -->
                <div class="virtual-pour">
                    <div class="v-flask-neck"></div>
                    <div class="v-flask-body"></div>
                </div>

                <div class="pour-stream"></div>

                <div class="test-tube">
                    <div class="liquid"></div>
                </div>

                <div class="water-bath-container">
                    <div class="flame"></div>
                    <div class="burner"></div>
                    <div class="bath-glass">
                        <div class="bath-water"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="black-area">
        <div id="log">Начните эксперимент: прилейте AgNO₃</div>
        <div class="controls">
            <!-- Добавил класс action-btn, чтобы не отключать верхние кнопки -->
            <button class="action-btn" onclick="action('AgNO3')">AgNO₃</button>
            <button class="action-btn" onclick="action('NaOH')">NaOH</button>
            <button class="action-btn" onclick="action('NH3')">NH₃</button>
            <button class="action-btn" onclick="action('aldehyde')">Альдегид</button>
            <button class="action-btn" onclick="action('heat')">Нагрев</button>
        </div>
    </div>
    <script>
        // Простой скрипт для переключения видимости меню
        document.addEventListener('click', function(e) {
            // Закрываем меню, если клик был вне кнопки
            if (!e.target.closest('.top-btn')) {
                const dropdown = document.querySelector('.dropdown-content');
                if (dropdown) dropdown.style.display = 'none';
            }
        });

        // Привязываем открытие/закрытие к кнопке (через атрибут onclick в HTML выше)
        document.querySelector('.top-btn').onclick = function() {
            const menu = this.nextElementSibling;
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }
    </script>
</body>
</html>
