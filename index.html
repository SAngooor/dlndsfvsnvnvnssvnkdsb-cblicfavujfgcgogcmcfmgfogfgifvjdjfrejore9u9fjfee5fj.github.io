        function calculate() {
            const age = parseInt(document.getElementById("age").value);
            const weight = parseFloat(document.getElementById("weight").value);
            const height = parseFloat(document.getElementById("height").value);
            const gender = document.getElementById("gender").value;
            const activity = parseFloat(document.getElementById("activity").value);
            const goal = parseInt(document.getElementById("goal").value);

            if (isNaN(age) || isNaN(weight) || isNaN(height)) {
                document.getElementById("result").innerText = "Введите корректные данные.";
                return;
            }

            const bmr = gender === "Мужской"
                ? 88.36 + (13.4 * weight) + (4.8 * height) - (5.7 * age)
                : 447.6 + (9.2 * weight) + (3.1 * height) - (4.3 * age);

            const calories = Math.round(bmr * activity + goal);
            const protein = Math.round(0.3 * calories / 4);
            const fats = Math.round(0.2 * calories / 9);
            const carbs = Math.round(0.5 * calories / 4);

            document.getElementById("result").innerHTML = `
                <b>Суточная норма:</b><br>
                Калории: ${calories} ккал<br>
                Белки: ${protein} г, Жиры: ${fats} г, Углеводы: ${carbs} г
            `;

            const target = {
                calories: calories / 4,
                protein: protein / 4,
                fat: fats / 4,
                carbs: carbs / 4
            };

            function selectDishWithMass(dishList, target) {
                let best = null;
                let bestDiff = Infinity;

                for (const dish of dishList) {
                    let ratio = Math.min(
                        target.calories / dish.calories,
                        target.protein / dish.protein,
                        target.fat / dish.fat,
                        target.carbs / dish.carbs
                    );

                    ratio = Math.max(0.5, Math.min(ratio, 5));

                    const adjusted = {
                        name: dish.name,
                        mass: Math.round(ratio * 100),
                        calories: Math.round(dish.calories * ratio),
                        protein: Math.round(dish.protein * ratio),
                        fat: Math.round(dish.fat * ratio),
                        carbs: Math.round(dish.carbs * ratio)
                    };

                    const diff = Math.abs(adjusted.calories - target.calories)
                            + Math.abs(adjusted.protein - target.protein)
                            + Math.abs(adjusted.fat - target.fat)
                            + Math.abs(adjusted.carbs - target.carbs);

                    if (diff < bestDiff) {
                        best = adjusted;
                        bestDiff = diff;
                    }
                }

                return best;
            }

            function totalMacros(meals) {
                return meals.flat().reduce((sum, m) => ({
                    calories: sum.calories + m.calories,
                    protein: sum.protein + m.protein,
                    fat: sum.fat + m.fat,
                    carbs: sum.carbs + m.carbs
                }), { calories: 0, protein: 0, fat: 0, carbs: 0 });
            }

            function addSecondDishIfNeeded(meals, type) {
                const current = totalMacros([meals.breakfast, meals.lunch, meals.dinner, meals.snack]);
                const remaining = {
                    calories: calories - current.calories,
                    protein: protein - current.protein,
                    fat: fats - current.fat,
                    carbs: carbs - current.carbs
                };

                if (remaining.calories < 100) return;

                const dish = selectDishWithMass(dishes[type], {
                    calories: remaining.calories / 2,
                    protein: remaining.protein / 2,
                    fat: remaining.fat / 2,
                    carbs: remaining.carbs / 2
                });

                if (dish) meals[type].push(dish);
            }
            function getTotalMacros(meals) {
                const total = {
                    calories: 0,
                    protein: 0,
                    fat: 0,
                    carbs: 0
                };

                for (const mealType in meals) {
                    meals[mealType].forEach(dish => {
                        total.calories += dish.calories;
                        total.protein += dish.protein;
                        total.fat += dish.fat;
                        total.carbs += dish.carbs;
                    });
                }

                return total;
            }


            const meals = {
                breakfast: [selectDishWithMass(dishes.breakfast, target)],
                lunch: [selectDishWithMass(dishes.lunch, target)],
                dinner: [selectDishWithMass(dishes.dinner, target)],
                snack: [selectDishWithMass(dishes.snack, target)]
            };

            // Добавим второе блюдо, если нужно (в порядке приоритета)
            ["lunch", "dinner", "breakfast", "snack"].forEach(type => {
                addSecondDishIfNeeded(meals, type);
            });

            function renderMeals(mealName, items, emoji) {
                return items.map(item =>
                    `<tr><td>${emoji} ${mealName}</td><td>${item.name}</td><td>${item.mass}</td><td>${item.calories}</td><td>${item.protein}</td><td>${item.fat}</td><td>${item.carbs}</td></tr>`
                ).join("");
            }

            document.getElementById("menu").innerHTML = `
                <h3>Рекомендуемый рацион:</h3>
                <table>
                    <tr><th>Прием пищи</th><th>Блюдо</th><th>Масса (г)</th><th>Ккал</th><th>Б</th><th>Ж</th><th>У</th></tr>
                    ${renderMeals("Завтрак", meals.breakfast, "🍳")}
                    ${renderMeals("Обед", meals.lunch, "🍲")}
                    ${renderMeals("Ужин", meals.dinner, "🥗")}
                    ${renderMeals("Перекус", meals.snack, "🍎")}
                </table>
            `;
            const totals = getTotalMacros(meals);
            document.getElementById("menu").innerHTML += `
                <p><b>Фактический рацион:</b><br>
                Калории: ${totals.calories} ккал, Белки: ${totals.protein} г, Жиры: ${totals.fat} г, Углеводы: ${totals.carbs} г</p>
            `;
